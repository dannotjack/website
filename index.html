<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b6b9b3">
<meta name="description" content="Hi, I'm Dan. Not Jack.">
<title>Dan — Not Jack.</title>
<link rel="preload" as="image" href="24003.jpg">
<style>
:root { color-scheme: light; background: #b6b9b3; color: #161616; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
main { position: relative; min-height: 100vh; min-height: 100svh; isolation: isolate; overflow: hidden; }
.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; z-index: -1; }
h1 { position: absolute; left: 62%; right: 4%; top: 35%; margin: 0; font-size: clamp(2rem, 4.5vw, 6rem); font-weight: 600; letter-spacing: -0.065em; line-height: 1.06; }
h1 span { display: block; }
/* Portrait screens: keep the face in frame and use the clear wall above it. */
@media (max-aspect-ratio: 1/1) {
 .photo { object-position: 33% center; }
 h1 { top: max(20px, env(safe-area-inset-top)); left: 6%; right: 6%; text-align: right; font-size: clamp(1.75rem, 6vw, 2.75rem); }
}
@media (prefers-reduced-motion: no-preference) { /* Intentionally still: the original photograph is the entire background. */ }
</style>
</head>
<body>
<main>
<img class="photo" src="24003.jpg" alt="" fetchpriority="high">
<h1><span>Hi, I'm Dan.</span><span>Not Jack.</span></h1>
</main>
</body>
</html>
